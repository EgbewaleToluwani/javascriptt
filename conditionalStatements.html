<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    



    <script>
        //if, else, else if
        let food = "rice"
        if (food == "beans") {
            console.log("There is beans");
        }

        if (food == "beans" || food == "ewa") {
            console.log("There is beans");
        } else {
            console.log("There is rice");
        
        } 
            
        

        if (food=="rice") {
            console.log("There is rice");

        } else if (food=="fufu") {
            console.log("There is fufu");

        } else if (food=="beans") {
            console.log("There is beans");

        } else {
            console.log("There is no more food");

        }


        //if a number is even log even number else log odd number
        let number = 15
        if (number%2 == 0) {
            console.log("Even number");
            
        } else {
            console.log("Odd number");
            
        }


        //if number is divisible by 3 and 5 log fizzbuzz, if number is
        if (number%3 == 0 && number%5 == 0) {
            console.log("fizzbuzz");
            
        } else if (number%5 == 0) {
            console.log("buzz");
            
        } else if (number%3 == 0) {
            console.log("fizz");
        } else {
            console.log("Not divisible by 3 or 5");
            
        }
            
        

    </script>
