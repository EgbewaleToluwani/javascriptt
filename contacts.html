<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .formDetails {
            border: 1px solid black;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 30rem;
            padding: 40px 20px;
            margin-left: 30px;
            margin-top: 70px;
        }

        .formDetails input {
            height: 70px;
            padding-left: 20px;
        }

        .formDetails button {
            width: 40%;
        }

        #contactList {
            margin-top: 50px;
            margin-left: 30px;
            margin-bottom: 50px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
    </style>
</head>
<body>
    

    <!-- image, first name, last name, workplace
    submit, edit, delete
    list -->

    <div class="formDetails">
        <h2>CONTACTS</h2>
        <input type="text" id="firstName" placeholder="First Name" autofocus>
        <input type="text" id="lastName" placeholder="Last Name">
        <input type="text" id="workplace" placeholder="Workplace">
        <input type="text" id="profilePicture" placeholder="Profile Picture">
        <button class="btn btn-success" onclick="addContact()">Add Contact</button>
    </div>   

    <button class="btn btn-primary ms-4 mt-5" onclick="viewContacts()">View Contacts</button>
    <div id="contactList"></div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

            let contact = {
                firstName: firstName.value,
                lastName: lastName.value,
                workplace: workplace.value,
                profilePicture: profilePicture.value || defaultProfilePicture,
                blocked: false
            }

            if (profilePicture.value.trim()=='') {
                profilePicture.value=""
            } else {
                profilePicture.value = profilePicture.value
            }

            if (firstName.value.trim()=='' || lastName.value.trim()=='' || workplace.value.trim()=='') {
                alert("Please fill the form")
            } else {
                contacts.push(contact)
            }


            firstName.value=''
            lastName.value=''
            workplace.value=''
            profilePicture.value=''
            console.log(contacts);
        }

        function viewContacts() {
            contactList.innerHTML=''
            for (let i = 0; i < contacts.length; i++) {
                const element = contacts[i];
                contactList.innerHTML+=`<div class="card" style="width: 18rem;">
<img src="${element.profilePicture}" class="card-img-top" alt="...">
<div class="card-body">
    <h5 class="card-title">${element.firstName} ${element.lastName}</h5>
    <p class="card-text">Workplace: ${element.workplace}</p>
  </div>
  <ul class="list-group list-group-flush d-flex flex-column gap-3 pe-2 pb-3 pt-3">
    <li class="d-flex justify-content-end"><button onclick="editContact(${i})" class="btn btn-dark w-50">Edit</button></li>
    <li class="d-flex justify-content-end"><button onclick="blockContact(${i})" id="btn-${i}" class="btn w-50 btn-warning">Block</button></li>
    <li class="d-flex justify-content-end"><button onclick="deleteContact(${i})" class="btn btn-danger w-50">Delete</button></li>
  </ul>
</div>`
            }
        }

        function editContact(index) {
            let newFirstName = prompt("First Name:", contacts[index].firstName)
            let newLastName = prompt("Last Name:", contacts[index].lastName)
            let newWorkplace = prompt("Workplace:", contacts[index].workplace)
            let newProfilePicture = prompt("Profile Picture:", contacts[index].profilePicture)

            contacts[index] = {
                firstName: newFirstName?newFirstName:contacts[index].firstName,
                lastName: newLastName?newLastName:contacts[index].lastName,
                workplace: newWorkplace?newWorkplace:contacts[index].workplace,
                profilePicture: newProfilePicture?newProfilePicture:contacts[index].profilePicture
            }
            viewContacts()
        }
        
        function blockContact(index) {
            contacts[index].blocked=!contacts[index].blocked
            console.log(contacts[index].blocked);
            let blockButton = document.getElementById(`btn-${index}`)
            contacts[index].blocked
                ? (blockButton.style.backgroundColor = "red", blockButton.innerText="Unblock")
                : (blockButton.style.backgroundColor = "#ffc107", blockButton.innerText='Block');
        }
    
        function deleteContact(index) {
            contacts.splice(index, 1)
            viewContacts()
        }
    </script>
</body>
</html>
