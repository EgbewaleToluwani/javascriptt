<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        #verse {
            font-size: 20px;
            display: flex;
            justify-content: center;
        }
    </style>
    <p id="verse"></p>

    
    
    


    <script>
        let stanza = ''
        
        for (let i=99; i>=3; i--) {
            stanza += `${i} bottles of beer on the wall, ${i} bottles of beer. Take one down and pass it around, ${i-1} bottles of beer on the wall

            `
        }
        stanza += `2 bottles of beer on the wall, 2 bottles of beer. Take one down and pass it around, 1 bottle of beer on the wall

        `
        
        stanza += `1 bottle of beer on the wall, 1 bottle of beer. Take one down and pass it around, no more bottles of beer on the wall
        
        `

        stanza += `No more bottles of beer on the wall, no more bottles of beer. Go to the store and buy some more, 99 bottles of beer on the wall
        
        `
        verse.innerText = stanza
    
    </script>
</body>
</html>
