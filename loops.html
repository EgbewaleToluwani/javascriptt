<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    


    <script>
        //for, while, do while

        // for (starting, condition, steps) {
        //      statement
        // }

        for (let i=0; i<=10; i++) {
            console.log(i);
        }
        for (let j=10; j>=0; j--) {
            console.log(j);
        }

        //range of 0-20, log even and odd numbers
        for (let i=0; i<=20; i++) {
            if (i%2==0) {
                console.log(i + ": Even number");
            } else {
                console.log(i + ": Odd number");
            }
        }

        //%5 buzz, %3 fizz, %3 %5 fizzbuzz
        for (let i=0; i<=20; i++) {
            if (i%3==0 && i%5==0) {
                console.log(i + ": fizzbuzz");
            } else if (i%5==0) {
                console.log(i + ": buzz");
            } else if (i%3==0) {
                console.log(i + ": fizz");
            } else {
                console.log(i + ": is not divisible by 5 nor 3");
                
            }
        }

        //Nested loops
        for (let carton=1; carton<=10; carton++ ) {
            for (let biscuits=1; biscuits<=20; biscuits++) {
                //console.log(`${biscuits}biscuits, ${carton}cartons`);
                console.log(`${biscuits}x${carton} = ${biscuits*carton}`);
                
                
            }
        }


    </script>
</body>
</html>
