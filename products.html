<body onload="getFromLocal()">
    <input type="text" id="prodName" placeholder="Product Name" autofocus>
    <input type="text" id="prodPrice" placeholder="Product Price">
    <input type="text" id="prodQuantity" placeholder="Product Quantity">
    <input type="text" id="prodDescription" placeholder="Product Description">
    <input type="text" id="prodImage" placeholder="Product Image">


    <button onclick="submitProduct()">submit</button>
    <br><br>
    <input type="text" id="inp" onkeyup="searchItem()" placeholder="search products">
    <br><br>
    <button onclick="deleteProduct()">deleteLast</button>
    <button onclick="addFirst()">Add First</button>
    <button onclick="deleteFirst()">Delete First</button>
    <button onclick="reverseProducts()">Reverse</button>

    <div id="prodList" class="mt-5 d-flex gap-3"></div>

    <script>
        let prodArray=[]
        // localStorage.setItem("products", "rice")

        function submitProduct() {
            let prodObj = {
                prodName: prodName.value,
                prodPrice: prodPrice.value,
                prodQuantity: prodQuantity.value,
                prodDescription: prodDescription.value,
                addedToCart: false
            }


            //we have objects inside the array. each item is an object taking four values - name, price, quantity, image - instead of the singular name value we had before.
            //each item has four values, the array contains different items
            //we have Ai, Aii, Aiii, Aiv, Bi, Bii, Biii, Biv...

            saveToLocal()
            prodArray.push(prodObj)   
            prodName.value=''
            prodPrice.value=''
            prodQuantity.value=''
            prodDescription.value=''
            prodImage.value=''
            displayProd()
        }

        function saveToLocal() {
            let convProd = JSON.stringify(prodArray)
            localStorage.setItem("products", convProd)
        }

        function getFromLocal() {
            let prod = localStorage.getItem("products")
            let convProd = JSON.parse(prod)
            if (convProd==null) {
                console.log("Nothing to display");
                
            } else {
                prodArray = convProd
                displayProd()
            }
            
        }

        const searchItem=()=>{
            let searchedProd=prodArray.filter(prod=>prod.prodName.trim().toLowerCase().includes(inp.value.trim().toLowerCase()))
            
            if (inp.value.trim() !==  "") {
                prodArray=searchedProd
                displayProd()
            } else {
                getFromLocal()
                displayProd()
            }
        }

        function displayProd() {
            prodList.innerHTML=''
                for (let i = 0; i < prodArray.length; i++) {
                    const element = prodArray[i];
                    //element is now iterating through objects, not individual values so we need to iterate the objects so it shows the values inside the objects not the objects themselves
                    prodList.innerHTML+=`<div class="card" style="width: 25rem; padding: 0 5px">
                        <img src="${element.prodImage}" class="card-img-top" alt="...">
                        <div class="card-body">
                            <h5 class="card-title">${element.prodName}</h5>
                            <p class="card-text">${element.prodDescription}</p>
                            <span>Price: $${element.prodPrice}</span>&emsp;<span>Quantity: ${element.prodQuantity}</span>
                            <br>
                            <div class="d-flex gap-2 mb-2">
                                <button class="btn btn-primary" onclick="edit(${i})">Edit</button><button class="btn btn-danger" onclick="deleteSpecific(${i})">Delete</button>
                                </div>
                                <button class="btn btn-dark" id="btn-${i}" onclick="addToCart(${i})">Add to Cart</button>
                                </div>
                                </div>`
                }
        }

        function addToCart(index) {
            prodArray[index].addedToCart=!prodArray[index].addedToCart
            console.log(prodArray[index]);
            let btnId = document.getElementById(`btn-${index}`)
            console.log(btnId);
            console.log(btnId.style.backgroundColor);
            
            
            if (prodArray[index].addedToCart) {
                btnId.style.backgroundColor = "green"
                btnId.textContent="Added to Cart"
            } else {
                btnId.style.backgroundColor = "black"
                btnId.textContent="Add to Cart"
            }
            saveToLocal()
            
        }

       

        function deleteSpecific(index) {
            prodArray.splice(index, 1)
            displayProd()
            saveToLocal()            
        }

        function deleteProduct() {
            prodArray.pop()
            displayProd()
        }

        function addFirst() {
            prodArray.unshift(prodName.value)
            prodName.value=''
            displayProd()
        }
   
        function deleteFirst() {
            prodArray.shift()
            displayProd()
        }

        function reverseProducts() {
            prodArray.reverse()
