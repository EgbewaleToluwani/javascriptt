<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <input class="mb-5 mt-2 ms-5 ps-3 me-3" style="width: 700px; height: 50px; border-radius: 10px;" placeholder="Search" type="text" id="searchBar">
    <button style="height: 50px; border-radius: 10px;" onclick="search()">Search</button>

    <div id="result" class="d-flex gap-3 flex-wrap"></div>


    <script>
        //fetch, api, callback, async and await, .then

        let url="https://dummyjson.com/products"

        //FETCH and .THEN

        const makeRequest=()=>{
            fetch(url) //this is a promise
            //to resolve the promise we use .then or async and await
            //for each fetch we use 2 .then
            .then((response)=>{
                return response.json()
            })
            .then((data)=>{
                console.log(data);
                const output = data.products
                console.log(output);

                //to display it on the page, you need to loop through it
                //we use map function
                
                output.map((processedData, index)=>{
                    result.innerHTML+=`<div class="card" style="width: 18rem;">
  <img src="${processedData.images[0]}" class="card-img-top" alt="...">
  <div class="card-body">
    <h5 class="card-title">${processedData.title}</h5>
    <p class="card-text">${processedData.description}</p>
    <div class="d-flex justify-content-between align-items-center">
    <a href="#" class="btn btn-primary">Go somewhere</a>
    <span>${processedData.price}</span>
    </div>
  </div>
</div>`

                })    
            })
        }

        const search=()=>{
            let url="https://dummyjson.com/products"
            fetch(url) 

            .then((response)=>{
                return response.json()
            })
            .then((data)=>{
                console.log(data);
                const output = data.products
                console.log(output);
                let searched=output.filter(item=>item.title.trim().toLowerCase().includes(searchBar.value.trim().toLowerCase()))
                result.innerHTML=""

                //to display it on the page, you need to loop through it
                //we use map function
                
                searched.map((processedData, index)=>{
                    result.innerHTML+=`<div class="card" style="width: 18rem;">
  <img src="${processedData.images[0]}" class="card-img-top" alt="...">
  <div class="card-body">
    <h5 class="card-title">${processedData.title}</h5>
    <p class="card-text">${processedData.description}</p>
    <div class="d-flex justify-content-between align-items-center">
    <a href="#" class="btn btn-primary">Go somewhere</a>
    <span>${processedData.price}</span>
    </div>
  </div>
</div>`

                })    
            })


            
            
        }
        
        makeRequest()
    </script>
</body>
</html>
