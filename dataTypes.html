<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    




    <script>
        //string
        console.log('I am a boy');
        console.log("I am a boy");
        console.log(`I am a boy`);
        
        //numbers
        console.log(24);
        

        //boolean
        console.log(true);
        console.log(false);
        
        console.log(typeof(false));
        

        //objects
        console.log({name: 'uk'});
        console.log(typeof({name: 'uk'}));
        

        //array
        console.log([1,2,3,'uk',true]);
        console.log(typeof([1,2,3,'uk',true]));
        
        
        //null
        console.log(null);
        

        //undefined
        console.log(undefined);

        
        
    </script>
</body>
</html>
